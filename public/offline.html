<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>You're offline — MindTalk AI</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        background: #f5faf8;
        color: #143b36;
      }
      .card {
        max-width: 22rem;
        text-align: center;
      }
      h1 { font-size: 1.4rem; margin: 0 0 0.5rem; }
      p { color: #4c6f69; line-height: 1.6; margin: 0 0 1.5rem; }
      button {
        min-height: 44px;
        padding: 0 1.5rem;
        border: 0;
        border-radius: 1rem;
        background: #0f9b8e;
        color: #fff;
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>MindTalk AI needs a connection for this screen. Your saved logs will sync once you're back online.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
